name: Start Countdown

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  start-countdown:
    name: Start Countdown
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest
          no-cache: true

      - name: Install Firebase Admin
        run: bun add firebase-admin@12

      - name: Start countdown in RTDB
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_DATABASE_URL: ${{ secrets.FIREBASE_DATABASE_URL }}
        run: |
          cat > /tmp/countdown.js << 'EOF'
          const admin = require("firebase-admin");

          if (!process.env.FIREBASE_SERVICE_ACCOUNT) {
            throw new Error("Missing FIREBASE_SERVICE_ACCOUNT secret.");
          }
          if (!process.env.FIREBASE_DATABASE_URL) {
            throw new Error("Missing FIREBASE_DATABASE_URL secret.");
          }

          const serviceAccount = JSON.parse(process.env.FIREBASE_SERVICE_ACCOUNT);
          admin.initializeApp({
            credential: admin.credential.cert(serviceAccount),
            databaseURL: process.env.FIREBASE_DATABASE_URL,
          });

          const ref = admin.database().ref("countdown");
          const now = Date.now();

          ref.transaction((current) => {
            if (current && current.startTimestamp) {
              return;
            }
            return {
              startTimestamp: now,
              startedBy: "github-actions",
              days: 1356,
            };
          }, (error, committed) => {
            if (error) {
              console.error("Failed to start countdown:", error);
              process.exit(1);
            }
            if (!committed) {
              console.log("Countdown already started. No changes made.");
              process.exit(0);
            }
            console.log("Countdown started:", new Date(now).toISOString());
            process.exit(0);
          });
          EOF
          bun /tmp/countdown.js
